<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">列车减速时把一部分转动能量变回电</title>
  <desc id="desc">图从左向右分三格：列车减速时车轮仍在转；车轮带着牵引电动机工作成发电机；一部分电沿电缆回到车载电池，让电量增加一格。列车仍需其他制动装置共同停车。</desc>
  <defs><marker id="blueArrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 16 9 2 16Z" fill="#4c8fb5"/></marker></defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>
  <g fill="#f6f0e4" stroke="#d8d0c2" stroke-width="4"><rect x="35" y="45" width="330" height="565" rx="28"/><rect x="435" y="45" width="330" height="565" rx="28"/><rect x="835" y="45" width="330" height="565" rx="28"/></g>
  <g font-family="system-ui, sans-serif" fill="#25364a" text-anchor="middle">
    <text x="200" y="104" font-size="32" font-weight="850">① 车轮还在转</text><text x="600" y="104" font-size="32" font-weight="850">② 电动机变发电机</text><text x="1000" y="104" font-size="32" font-weight="850">③ 电回来一部分</text>
  </g>
  <path d="M79 362V243Q79 188 139 188H275Q333 188 340 362Z" fill="#67ad8a" stroke="#25364a" stroke-width="8"/>
  <path d="M126 229H282Q305 229 318 290H106Q113 248 126 229Z" fill="#dff2f6" stroke="#25364a" stroke-width="5"/>
  <g fill="#465864" stroke="#25364a" stroke-width="6"><circle cx="147" cy="402" r="48"/><circle cx="287" cy="402" r="48"/></g>
  <path d="M105 511H313" stroke="#677986" stroke-width="12" stroke-linecap="round"/>
  <path d="M116 442c-55-28-57-96-8-132" fill="none" stroke="#4c8fb5" stroke-width="8" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="200" y="568" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#52687c">列车正在慢下来</text>
  <g transform="translate(600 333)">
    <circle r="112" fill="#e7c367" stroke="#25364a" stroke-width="9"/>
    <path d="M-42-44v88M42-44v88M-42-44 0 8 42-44" fill="none" stroke="#25364a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-148 0h31M117 0h31" stroke="#4c8fb5" stroke-width="9" stroke-linecap="round"/>
    <path d="M-4-151c87 3 154 70 156 153" fill="none" stroke="#4c8fb5" stroke-width="8" marker-end="url(#blueArrow)"/>
  </g>
  <text x="600" y="535" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" font-weight="750" fill="#25364a">原来推轮子的机器，反过来发电</text>
  <g transform="translate(1000 324)">
    <rect x="-112" y="-123" width="224" height="246" rx="28" fill="#5f9fc7" stroke="#25364a" stroke-width="9"/><path d="M112-35h28v70h-28" fill="#25364a"/>
    <rect x="-72" y="53" width="38" height="36" rx="6" fill="#dff2f6"/><rect x="-20" y="18" width="38" height="71" rx="6" fill="#dff2f6"/><rect x="32" y="-20" width="38" height="109" rx="6" fill="#e7c367"/>
  </g>
  <text x="1000" y="535" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" font-weight="750" fill="#25364a">电池多存下一点电</text>
  <path d="M382 327H419M782 327H819" stroke="#4c8fb5" stroke-width="8" stroke-linecap="round" marker-end="url(#blueArrow)"/>
</svg>
