<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">尖轨贴向哪边，列车就走向哪边</title>
  <desc id="desc">上下两幅道岔俯视图。上图尖轨贴住直线一侧，蓝色路线直行；下图尖轨贴住弯线一侧，蓝色路线转弯。每幅图只突出当前接通的一条路线。</desc>
  <defs>
    <marker id="routeArrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#4f8298"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="34" fill="#fffaf1"/>

  <!-- 两幅图使用同一套灰色道岔；蓝线只表示这一刻接通的路线。 -->
  <g font-family="system-ui, sans-serif" fill="#26394b">
    <g transform="translate(45 38)">
      <rect width="1110" height="318" rx="28" fill="#f3f0e8" stroke="#d5c9b7" stroke-width="5"/>
      <rect x="24" y="23" width="214" height="62" rx="31" fill="#d7e8ed"/>
      <text x="131" y="66" font-size="39" font-weight="800" text-anchor="middle">去这边：直走</text>

      <g fill="none" stroke="#788794" stroke-width="15" stroke-linecap="round">
        <path d="M82 166H1030"/>
        <path d="M425 166C600 166 690 104 1030 103"/>
      </g>
      <g fill="none" stroke="#dfe4e6" stroke-width="5" stroke-linecap="round">
        <path d="M82 166H1030"/>
        <path d="M425 166C600 166 690 104 1030 103"/>
      </g>

      <!-- 尖轨平贴直线。 -->
      <path d="M410 181C505 181 570 178 652 171" fill="none" stroke="#d6ae66" stroke-width="20" stroke-linecap="round"/>
      <path d="M410 181C505 181 570 178 652 171" fill="none" stroke="#fff3d5" stroke-width="5" stroke-linecap="round"/>
      <circle cx="421" cy="181" r="17" fill="#e8c87e" stroke="#26394b" stroke-width="5"/>

      <path d="M104 166H1002" fill="none" stroke="#4f8298" stroke-width="7" stroke-linecap="round" marker-end="url(#routeArrow)"/>
      <text x="560" y="267" font-size="34" font-weight="750" text-anchor="middle">尖轨贴住直线</text>
      <path d="M560 239V204" fill="none" stroke="#846f4b" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(45 404)">
      <rect width="1110" height="318" rx="28" fill="#f3f0e8" stroke="#d5c9b7" stroke-width="5"/>
      <rect x="24" y="23" width="214" height="62" rx="31" fill="#d7e8ed"/>
      <text x="131" y="66" font-size="39" font-weight="800" text-anchor="middle">去那边：转弯</text>

      <g fill="none" stroke="#788794" stroke-width="15" stroke-linecap="round">
        <path d="M82 166H1030"/>
        <path d="M425 166C600 166 690 104 1030 103"/>
      </g>
      <g fill="none" stroke="#dfe4e6" stroke-width="5" stroke-linecap="round">
        <path d="M82 166H1030"/>
        <path d="M425 166C600 166 690 104 1030 103"/>
      </g>

      <!-- 同一片尖轨转到弯线一侧。 -->
      <path d="M410 181C505 174 570 148 652 121" fill="none" stroke="#d6ae66" stroke-width="20" stroke-linecap="round"/>
      <path d="M410 181C505 174 570 148 652 121" fill="none" stroke="#fff3d5" stroke-width="5" stroke-linecap="round"/>
      <circle cx="421" cy="181" r="17" fill="#e8c87e" stroke="#26394b" stroke-width="5"/>

      <path d="M104 166H404C568 166 684 104 1002 103" fill="none" stroke="#4f8298" stroke-width="7" stroke-linecap="round" marker-end="url(#routeArrow)"/>
      <text x="560" y="267" font-size="34" font-weight="750" text-anchor="middle">尖轨贴住弯线</text>
      <path d="M560 239 579 171" fill="none" stroke="#846f4b" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
