<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">四层轨道把列车的重量慢慢摊开</title>
  <desc id="desc">正面剖面图从上到下只有钢轨、轨枕、道砟和地基四层。中间一条半透明的受力带向下逐层变宽，表示列车重量被一层层分散开，而不是树根式分叉。</desc>
  <defs>
    <marker id="loadArrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#b9665d"/>
    </marker>
    <pattern id="ballast" width="66" height="48" patternUnits="userSpaceOnUse">
      <path d="m3 31 15-20 25 3 14 20-17 12-26-4Z" fill="#aebcc2" stroke="#71808b" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>
  <text x="600" y="55" font-family="system-ui, sans-serif" font-size="38" font-weight="760" text-anchor="middle" fill="#25364a">重量往下，慢慢摊开</text>

  <path d="M540 85H660L1010 646H190Z" fill="#d88b7c" opacity=".18"/>
  <path d="M540 85 190 646M660 85 1010 646" fill="none" stroke="#bc6e63" stroke-width="4" stroke-dasharray="15 14" opacity=".72"/>
  <path d="M600 92V610" fill="none" stroke="#b9665d" stroke-width="6" stroke-linecap="round" marker-end="url(#loadArrow)"/>

  <g fill="#647f91" stroke="#25364a" stroke-width="9">
    <circle cx="420" cy="116" r="64"/><circle cx="780" cy="116" r="64"/>
  </g>
  <path d="M420 116H780" stroke="#25364a" stroke-width="17"/>
  <g fill="#d9b965" stroke="#25364a" stroke-width="6"><circle cx="420" cy="116" r="17"/><circle cx="780" cy="116" r="17"/></g>
  <g fill="#6f7f8c" stroke="#25364a" stroke-width="7" stroke-linejoin="round">
    <path d="M368 175h104v27h-20v75h42v32H346v-32h42v-75h-20Z"/>
    <path d="M728 175h104v27h-20v75h42v32H706v-32h42v-75h-20Z"/>
  </g>
  <path d="M365 188H475M725 188H835" stroke="#dbe2e7" stroke-width="7" stroke-linecap="round"/>

  <rect x="245" y="296" width="710" height="78" rx="18" fill="#b8c5cd" stroke="#25364a" stroke-width="8"/>
  <path d="M145 374H1055L1002 527H198Z" fill="url(#ballast)" stroke="#71808b" stroke-width="8" stroke-linejoin="round"/>
  <path d="M105 527H1095L1045 650H155Z" fill="#c9b293" stroke="#8c755c" stroke-width="8" stroke-linejoin="round"/>
  <path d="M170 591H1030" stroke="#eee1cc" stroke-width="8" stroke-dasharray="28 20" opacity=".85"/>

  <g font-family="system-ui, sans-serif" font-size="36" font-weight="780" fill="#25364a">
    <rect x="44" y="188" width="184" height="58" rx="22" fill="#e3ebef"/><text x="136" y="229" text-anchor="middle">钢轨</text>
    <path d="M228 217H337" stroke="#526c7b" stroke-width="5" stroke-linecap="round" marker-end="url(#loadArrow)"/>
    <rect x="45" y="304" width="184" height="58" rx="22" fill="#e7ece9"/><text x="137" y="345" text-anchor="middle">轨枕</text>
    <path d="M229 333H245" stroke="#526c7b" stroke-width="5" stroke-linecap="round"/>
    <rect x="970" y="408" width="184" height="58" rx="22" fill="#e3ebef"/><text x="1062" y="449" text-anchor="middle">道砟</text>
    <path d="M970 437H927" stroke="#526c7b" stroke-width="5" stroke-linecap="round"/>
    <rect x="970" y="555" width="184" height="58" rx="22" fill="#eee3d3"/><text x="1062" y="596" text-anchor="middle">地基</text>
    <path d="M970 584H921" stroke="#526c7b" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
