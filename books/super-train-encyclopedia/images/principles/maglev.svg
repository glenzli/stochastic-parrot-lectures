<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">L0 超导磁悬浮列车低速用轮子、高速在 U 形导轨中浮起</title>
  <desc id="desc">左边是低速状态，橡胶轮落在导轨地面上；右边是高速状态，轮子收进车内，车侧超导磁体与导轨两侧线圈产生磁力，让列车在导轨中央浮起。图中特意放大了实际约十厘米的悬浮间隙。</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 16 9 2 16Z" fill="#4c8fb5"/></marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>
  <path d="M400 50V625" stroke="#d9d2c4" stroke-width="4" stroke-dasharray="12 14"/>
