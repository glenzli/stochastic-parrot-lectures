<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">一根空气管告诉每节车一起刹车</title>
  <desc id="desc">三节车下方有一根连续的蓝色制动管。司机刹车后，命令沿蓝管向后传播；每节车都用自己的空气罐推动本车轮旁的刹车块。</desc>
  <defs>
    <marker id="pipeArrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#448cad"/>
    </marker>
    <marker id="brakeArrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#c8754d"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>

  <!-- 三节清楚分开的车，每节各有两个轮子。 -->
  <g stroke="#25364a" stroke-width="8">
    <path d="M59 300V150H281Q326 150 350 194L374 300Z" fill="#d98779"/>
    <rect x="413" y="150" width="337" height="150" rx="27" fill="#75aebe"/>
    <rect x="789" y="150" width="337" height="150" rx="27" fill="#85ad8b"/>
  </g>
  <g fill="#d9edf4" stroke="#25364a" stroke-width="6">
    <rect x="92" y="181" width="112" height="70" rx="14"/>
    <path d="M225 181H279Q306 181 319 210L336 251H225Z"/>
    <rect x="449" y="181" width="118" height="70" rx="14"/><rect x="595" y="181" width="118" height="70" rx="14"/>
    <rect x="825" y="181" width="118" height="70" rx="14"/><rect x="971" y="181" width="118" height="70" rx="14"/>
  </g>
  <g fill="#52687c" stroke="#25364a" stroke-width="7">
    <circle cx="126" cy="326" r="47"/><circle cx="306" cy="326" r="47"/>
    <circle cx="486" cy="326" r="47"/><circle cx="677" cy="326" r="47"/>
    <circle cx="862" cy="326" r="47"/><circle cx="1053" cy="326" r="47"/>
  </g>

  <!-- 一根蓝管真正贯穿三节车。 -->
  <path d="M61 423H1138" fill="none" stroke="#448cad" stroke-width="13" stroke-linecap="round"/>
  <path d="M166 423H1086" fill="none" stroke="#d8edf3" stroke-width="4" stroke-dasharray="19 17" marker-end="url(#pipeArrow)"/>
  <path d="M214 397V449M590 397V449M966 397V449" stroke="#25364a" stroke-width="4" stroke-dasharray="5 7" opacity=".55"/>

  <!-- 每节车只有一个本车空气罐；橙色刹车块贴在本车车轮旁。 -->
  <g stroke="#25364a" stroke-width="7" stroke-linejoin="round">
    <rect x="112" y="480" width="164" height="61" rx="30" fill="#a5cbd7"/>
    <rect x="488" y="480" width="164" height="61" rx="30" fill="#a5cbd7"/>
    <rect x="864" y="480" width="164" height="61" rx="30" fill="#a5cbd7"/>
    <path d="M342 291Q370 326 342 361L324 347Q342 326 324 305Z" fill="#d48a5b"/>
    <path d="M713 291Q741 326 713 361L695 347Q713 326 695 305Z" fill="#d48a5b"/>
    <path d="M1089 291Q1117 326 1089 361L1071 347Q1089 326 1071 305Z" fill="#d48a5b"/>
  </g>
  <g fill="none" stroke="#c8754d" stroke-width="6" stroke-linecap="round" marker-end="url(#brakeArrow)">
    <path d="M276 511C326 497 354 437 348 370"/>
    <path d="M652 511C702 497 730 437 719 370"/>
    <path d="M1028 511C1078 497 1106 437 1095 370"/>
  </g>
  <g stroke="#448cad" stroke-width="6" fill="none">
    <path d="M194 423V480"/><path d="M570 423V480"/><path d="M946 423V480"/>
  </g>

  <!-- 驾驶室只留一个清楚的制动手柄。 -->
  <circle cx="277" cy="274" r="18" fill="#e9c66f" stroke="#25364a" stroke-width="6"/>
  <path d="M277 257V224L301 210" stroke="#25364a" stroke-width="7" stroke-linecap="round"/>
  <path d="M278 292V405" stroke="#448cad" stroke-width="6" stroke-linecap="round" marker-end="url(#pipeArrow)"/>

  <g font-family="system-ui, sans-serif" font-size="31" font-weight="800" text-anchor="middle" fill="#25364a">
    <text x="217" y="100">司机刹车</text>
    <text x="600" y="400">命令沿蓝管跑</text>
    <text x="600" y="619">每节车用自己的空气刹车</text>
  </g>
  <path d="M600 595V558" stroke="#637588" stroke-width="4" stroke-linecap="round"/>
</svg>
