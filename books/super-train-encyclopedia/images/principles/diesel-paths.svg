<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">柴油电力车辆把动力送到车轮</title>
  <desc id="desc">一条从左到右的单一路线：绿色柴油机带动蓝色发电机，电送到黄色电动机，最后转动车轮。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 14 8 2 14Z" fill="#3b82c4"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>

  <path d="M74 472V282Q74 164 205 150H979Q1076 174 1120 310V472Z" fill="#dff2fb" stroke="#25364a" stroke-width="10"/>
  <path d="M166 196H907Q997 196 1035 289H141Q147 226 166 196Z" fill="#fff" stroke="#25364a" stroke-width="7"/>
  <path d="M351 196V289M615 196V289M862 199L836 289" stroke="#25364a" stroke-width="6"/>
  <rect x="118" y="426" width="942" height="62" rx="22" fill="#25364a"/>

  <g transform="translate(150 330)">
    <rect width="205" height="132" rx="28" fill="#55b68b" stroke="#25364a" stroke-width="8"/>
    <path d="M43 1V-30h38V1M124 1V-30h38V1" stroke="#25364a" stroke-width="10"/>
    <path d="M42 51h121M42 91h121" stroke="#e9fff6" stroke-width="15" stroke-linecap="round"/>
  </g>

  <path d="M373 396H475" fill="none" stroke="#3b82c4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(548 396)">
    <circle r="69" fill="#4f9bd8" stroke="#25364a" stroke-width="8"/>
    <path d="M-36 0c21-34 49-34 70 0s49 34 70 0" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
  </g>

  <path d="M635 396H731" fill="none" stroke="#3b82c4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(804 396)">
    <circle r="66" fill="#ffd166" stroke="#25364a" stroke-width="8"/>
    <path d="M-23-28v56M23-28v56M-23-28 0 5 23-28" fill="none" stroke="#25364a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M887 396H955" fill="none" stroke="#3b82c4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(1035 438)">
    <circle r="77" fill="#52687c" stroke="#25364a" stroke-width="9"/>
    <circle r="25" fill="#ffd166" stroke="#25364a" stroke-width="7"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="29" font-weight="750" text-anchor="middle" fill="#25364a">
    <text x="252" y="559">① 柴油机转起来</text>
    <text x="548" y="559">② 发出电</text>
    <text x="804" y="559">③ 电动机转</text>
    <text x="1035" y="559">④ 车轮前进</text>
  </g>
  <path d="M72 594H1128" stroke="#667687" stroke-width="18" stroke-linecap="round"/>
</svg>
