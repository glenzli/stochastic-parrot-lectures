<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">干轨稳稳滚，湿轨和落叶会让车轮打滑</title>
  <desc id="desc">左边的车轮在干燥钢轨上稳稳滚向前。右边的同样车轮遇到水和落叶时容易空转打滑；右下角的小图表示撒一点砂可以增加抓地力。</desc>
  <defs>
    <marker id="steadyArrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#4f8b72"/>
    </marker>
    <marker id="slipArrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#c7755c"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="34" fill="#fffaf1"/>
  <path d="M34 34H596V641H34Z" fill="#eef3e9"/>
  <path d="M604 34H1166V641H604Z" fill="#eaf1f4"/>
  <path d="M600 48V627" stroke="#c9c0b3" stroke-width="4" stroke-dasharray="13 15"/>

  <g font-family="system-ui, sans-serif" font-size="34" font-weight="780" text-anchor="middle" fill="#26394b">
    <text x="300" y="82">干轨：稳稳滚</text>
    <text x="900" y="82">湿轨：容易打滑</text>
  </g>

  <!-- 左：车辆向前的距离与车轮转动配合。 -->
  <path d="M97 280Q97 214 163 214H462Q527 214 555 280V366H71V309Q71 280 97 280Z" fill="#7fa78f" stroke="#26394b" stroke-width="8"/>
  <path d="M151 252H463Q500 252 518 306H129V275Q129 252 151 252Z" fill="#dbe9e5" stroke="#26394b" stroke-width="5"/>
  <circle cx="330" cy="420" r="115" fill="#4d6070" stroke="#26394b" stroke-width="9"/>
  <circle cx="330" cy="420" r="48" fill="#d5dde1" stroke="#26394b" stroke-width="7"/>
  <path d="M246 374A97 97 0 0 1 422 404" fill="none" stroke="#4f8b72" stroke-width="6" stroke-linecap="round" marker-end="url(#steadyArrow)"/>
  <path d="M105 142H505" fill="none" stroke="#4f8b72" stroke-width="6" stroke-linecap="round" marker-end="url(#steadyArrow)"/>
  <path d="M71 535H555" stroke="#697986" stroke-width="27" stroke-linecap="round"/>
  <path d="M71 527H555" stroke="#dce3e6" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="330" cy="529" rx="48" ry="13" fill="#87b19a"/>

  <!-- 右：轮子转得快，车身向前箭头却很短；水和落叶挡在接触处。 -->
  <path d="M667 280Q667 214 733 214H1032Q1097 214 1125 280V366H641V309Q641 280 667 280Z" fill="#8ba2ad" stroke="#26394b" stroke-width="8"/>
  <path d="M721 252H1033Q1070 252 1088 306H699V275Q699 252 721 252Z" fill="#dce9ed" stroke="#26394b" stroke-width="5"/>
  <circle cx="900" cy="420" r="115" fill="#4d6070" stroke="#26394b" stroke-width="9"/>
  <circle cx="900" cy="420" r="48" fill="#d5dde1" stroke="#26394b" stroke-width="7"/>
  <path d="M811 382A97 97 0 1 1 974 363" fill="none" stroke="#c7755c" stroke-width="6" stroke-linecap="round" marker-end="url(#slipArrow)"/>
  <path d="M679 142H822" fill="none" stroke="#c7755c" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 11" marker-end="url(#slipArrow)"/>
  <path d="M641 535H1125" stroke="#697986" stroke-width="27" stroke-linecap="round"/>
  <path d="M641 527H1125" stroke="#bcd4df" stroke-width="8" stroke-linecap="round"/>
  <g fill="#6e9eb2">
    <path d="M786 471q-18 26 0 36 18-10 0-36Z"/>
    <path d="M1007 473q-17 24 0 34 17-10 0-34Z"/>
  </g>
  <g fill="#9a805c" stroke="#6f5a3d" stroke-width="3">
    <path d="M846 511q22-25 43-1-18 22-43 1Z"/>
    <path d="M936 515q18-27 42-6-14 24-42 6Z"/>
  </g>

  <!-- 撒砂只是湿滑一格里的小角标。 -->
  <g transform="translate(951 548)">
    <rect width="183" height="73" rx="22" fill="#fffaf1" stroke="#ad8a54" stroke-width="4"/>
    <path d="M19 15H67L56 43H31Z" fill="#c49a5c" stroke="#6f5a3d" stroke-width="4"/>
    <g fill="#c49a5c"><circle cx="34" cy="52" r="4"/><circle cx="44" cy="58" r="4"/><circle cx="55" cy="52" r="4"/></g>
    <text x="124" y="47" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="760" fill="#26394b">撒砂帮忙</text>
  </g>
</svg>
