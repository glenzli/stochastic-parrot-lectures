  <text x="779" y="163" font-family="system-ui, sans-serif" font-size="34" font-weight="760" text-anchor="middle" fill="#315f7b">电送进车里</text>

  <g font-family="system-ui, sans-serif" font-size="34" font-weight="760" fill="#25364a">
    <text x="735" y="600">供电轨</text>
