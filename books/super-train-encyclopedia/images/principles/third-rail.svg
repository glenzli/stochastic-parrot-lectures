<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">集电靴贴住供电轨，把电送进车里</title>
  <desc id="desc">电车底部的转向架伸出一根连续支臂，支臂末端的集电靴贴住有保护罩的第三轨。蓝色细箭头从供电轨经过集电靴和支臂进入车内，没有火花。</desc>
  <defs>
    <marker id="electricArrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#3f7fa5"/>
    </marker>
    <marker id="labelArrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#526c7b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>

  <path d="M82 98H886Q940 98 958 151L991 250H82Z" fill="#c96861" stroke="#25364a" stroke-width="11" stroke-linejoin="round"/>
  <rect x="150" y="145" width="704" height="54" rx="19" fill="#dcebf0" stroke="#25364a" stroke-width="8"/>
  <rect x="185" y="270" width="640" height="76" rx="28" fill="#3d5364" stroke="#25364a" stroke-width="10"/>
  <g fill="#647f91" stroke="#25364a" stroke-width="10">
