  <path d="M120 525H865" stroke="#6f7f8c" stroke-width="34" stroke-linecap="round"/>
  <path d="M120 516H865" stroke="#dbe2e7" stroke-width="8" stroke-linecap="round"/>

  <path d="M778 326 852 366 925 453" fill="none" stroke="#364b5a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="902" y="437" width="170" height="36" rx="14" fill="#364b5a" stroke="#25364a" stroke-width="7"/>

  <g fill="#d7b96e" stroke="#25364a" stroke-width="7">
    <path d="M918 550h43v76h-43zM1080 550h43v76h-43z"/>
  </g>
  <rect x="882" y="482" width="278" height="61" rx="10" fill="#648da5" stroke="#25364a" stroke-width="9"/>
  <path d="M870 462V418Q870 389 900 389H1145Q1170 389 1170 418V459" fill="none" stroke="#9aabaf" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
