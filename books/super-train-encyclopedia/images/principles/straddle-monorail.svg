<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">跨座式单轨的大轮压在梁顶，小轮贴着梁侧</title>
  <desc id="desc">正面剖面图里，乘客窗和车厢地板都在轮子上方。一个大的承重橡胶轮压在混凝土梁顶，两只较小的导向轮从左右贴住梁侧，帮助列车保持方向。</desc>
  <defs>
    <marker id="calloutArrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#587186"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="34" fill="#fffaf1"/>

  <!-- 乘客车厢完整地位于地板之上。 -->
  <path d="M210 309V205Q210 72 343 72H857Q990 72 990 205V309Z" fill="#719ea6" stroke="#26394b" stroke-width="10" stroke-linejoin="round"/>
  <path d="M287 253V184Q287 126 345 126H855Q913 126 913 184V253Z" fill="#dcebf0" stroke="#26394b" stroke-width="7"/>
  <path d="M443 127V253M600 127V253M757 127V253" stroke="#536b79" stroke-width="5"/>
  <rect x="192" y="300" width="816" height="51" rx="15" fill="#557784" stroke="#26394b" stroke-width="9"/>

  <!-- 车体下裙从两侧包住梁，中央轮组与乘客窗分开。 -->
  <path d="M213 346H475V588H282Q213 588 213 519Z" fill="#719ea6" stroke="#26394b" stroke-width="9" stroke-linejoin="round"/>
  <path d="M725 346H987V519Q987 588 918 588H725Z" fill="#719ea6" stroke="#26394b" stroke-width="9" stroke-linejoin="round"/>
  <path d="M505 342H695V414H505Z" fill="#445965" stroke="#26394b" stroke-width="8"/>

  <!-- 承重轮在地板下、梁顶上；导向轮只贴梁侧。 -->
  <circle cx="600" cy="395" r="58" fill="#414e59" stroke="#26394b" stroke-width="9"/>
  <circle cx="600" cy="395" r="22" fill="#cfdae0" stroke="#26394b" stroke-width="6"/>
  <path d="M505 453H695V675H505Z" fill="#bac4c9" stroke="#26394b" stroke-width="10"/>
  <path d="M503 453H697" stroke="#ecf0f1" stroke-width="17" stroke-linecap="round"/>
  <g fill="#414e59" stroke="#26394b" stroke-width="8">
    <circle cx="463" cy="522" r="42"/>
    <circle cx="737" cy="522" r="42"/>
  </g>
  <g fill="#cfdae0" stroke="#26394b" stroke-width="5">
    <circle cx="463" cy="522" r="15"/>
    <circle cx="737" cy="522" r="15"/>
  </g>

  <!-- 三个短标签；细长引线把名称直接指向结构。 -->
  <g font-family="system-ui, sans-serif" font-size="29" font-weight="770" fill="#26394b">
    <text x="955" y="281" text-anchor="end">车厢地板</text>
    <text x="342" y="410" text-anchor="middle">承重轮</text>
    <text x="918" y="542" text-anchor="middle">导向轮</text>
  </g>
  <g fill="none" stroke="#587186" stroke-width="5" stroke-linecap="round" marker-end="url(#calloutArrow)">
    <path d="M974 288 823 322"/>
    <path d="M402 401 531 397"/>
    <path d="M846 535 786 526"/>
  </g>
</svg>
