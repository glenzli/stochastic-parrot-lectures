<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">弯道外侧钢轨抬高，列车向弯心倾斜</title>
  <desc id="desc">从列车正面看，右边外侧钢轨比左边内侧钢轨高，列车随轨道向左侧弯心倾斜；只有一支长绿色箭头指出弯心方向。</desc>
  <defs>
    <marker id="greenArrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 14 8 2 14Z" fill="#3e9a78"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>

  <path d="M538 92H116" fill="none" stroke="#3e9a78" stroke-width="7" stroke-linecap="round" marker-end="url(#greenArrow)"/>
  <text x="327" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="33" font-weight="800" fill="#25364a">弯心在这边</text>

  <path d="M116 526 1038 365 1082 499 151 636Z" fill="#eadfcb" stroke="#9a7558" stroke-width="7" stroke-linejoin="round"/>
  <g transform="rotate(-10 600 482)" stroke-linecap="round">
    <g stroke="#9a7558" stroke-width="18">
      <path d="M225 455V558M385 455V558M545 455V558M705 455V558M865 455V558"/>
    </g>
    <path d="M165 474H980M165 548H980" stroke="#667687" stroke-width="22"/>
    <path d="M165 468H980M165 542H980" stroke="#d8e0e7" stroke-width="6"/>
  </g>

  <g transform="rotate(-10 591 355)">
    <path d="M365 463V253Q365 154 464 134H718Q817 154 817 253V463Z" fill="#ef8a7d" stroke="#25364a" stroke-width="11" stroke-linejoin="round"/>
    <path d="M424 270V214Q424 178 470 170H712Q758 178 758 214V270Z" fill="#dff2fb" stroke="#25364a" stroke-width="8"/>
    <path d="M591 170V270" stroke="#25364a" stroke-width="7"/>
    <rect x="409" y="349" width="364" height="76" rx="27" fill="#25364a"/>
    <g fill="#52687c" stroke="#25364a" stroke-width="8">
      <circle cx="470" cy="477" r="57"/>
      <circle cx="712" cy="477" r="57"/>
    </g>
    <g fill="#ffd166" stroke="#25364a" stroke-width="6">
      <circle cx="470" cy="477" r="19"/>
      <circle cx="712" cy="477" r="19"/>
    </g>
  </g>

  <g font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#25364a">
    <text x="171" y="585">内轨较低</text>
    <text x="947" y="342">外轨较高</text>
  </g>
  <path d="M978 351C959 386 930 411 896 428" fill="none" stroke="#9a7558" stroke-width="6" stroke-linecap="round" marker-end="url(#greenArrow)"/>

  <g transform="translate(883 80)">
    <rect width="252" height="146" rx="30" fill="#fff" stroke="#25364a" stroke-width="6"/>
    <path d="M37 102 215 67" stroke="#667687" stroke-width="18" stroke-linecap="round"/>
    <circle cx="63" cy="88" r="20" fill="#ffd166" stroke="#25364a" stroke-width="6"/>
    <circle cx="190" cy="63" r="20" fill="#ffd166" stroke="#25364a" stroke-width="6"/>
    <text x="126" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="750" fill="#25364a">两根钢轨有高低差</text>
  </g>
</svg>
