<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">两种供电都先在车内处理，再送给同一个电动机</title>
  <desc id="desc">左边的交流供电和直流供电各有一条细箭头，两条箭头汇入中间同一个车内先处理盒，再由一条箭头送到右边同一个电动机和车轮。</desc>
  <defs>
    <marker id="flowArrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#55788a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fffaf1"/>
  <text x="600" y="69" font-family="system-ui, sans-serif" font-size="42" font-weight="800" text-anchor="middle" fill="#26394b">不同的电，先在车里准备好</text>

  <!-- 两个供电入口。 -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(55 127)">
      <rect width="300" height="165" rx="28" fill="#e3eef2" stroke="#6f91a0" stroke-width="7"/>
      <path d="M45 48H255" stroke="#55788a" stroke-width="8" stroke-linecap="round"/>
      <path d="M112 112 151 53 190 112M151 53H196" fill="none" stroke="#26394b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="150" y="147" font-size="37" font-weight="800" fill="#26394b">交流供电 AC</text>
    </g>
    <g transform="translate(55 383)">
      <rect width="300" height="165" rx="28" fill="#f2e7de" stroke="#b58a76" stroke-width="7"/>
      <path d="M45 48H255" stroke="#a57060" stroke-width="8" stroke-linecap="round"/>
      <path d="M112 112 151 53 190 112M151 53H196" fill="none" stroke="#26394b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="150" y="147" font-size="37" font-weight="800" fill="#26394b">直流供电 DC</text>
    </g>
  </g>

  <!-- 一截透明车厢轮廓，把处理盒和电机圈在车内。 -->
  <path d="M458 159H946Q1052 159 1115 245V571H442V191Q442 159 458 159Z" fill="#edf2ef" stroke="#a5b0aa" stroke-width="7" stroke-dasharray="15 13"/>
  <text x="490" y="207" font-family="system-ui, sans-serif" font-size="30" font-weight="750" fill="#66766e">车里面</text>

  <!-- 两条输入线在同一个盒子前汇合。 -->
  <g fill="none" stroke="#55788a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M355 210H402Q430 210 430 238V312Q430 337 455 337H494" marker-end="url(#flowArrow)"/>
    <path d="M355 466H402Q430 466 430 438V362Q430 337 455 337H494" marker-end="url(#flowArrow)"/>
  </g>

  <rect x="515" y="254" width="316" height="166" rx="30" fill="#fff4d8" stroke="#917d52" stroke-width="8"/>
  <text x="673" y="324" font-family="system-ui, sans-serif" font-size="38" font-weight="800" text-anchor="middle" fill="#26394b">车内先处理</text>
  <text x="673" y="374" font-family="system-ui, sans-serif" font-size="29" font-weight="650" text-anchor="middle" fill="#665c47">变成电机能用的电</text>

  <!-- 处理好以后，只去同一个电动机和车轮。 -->
  <path d="M831 337H941" fill="none" stroke="#55788a" stroke-width="7" stroke-linecap="round" marker-end="url(#flowArrow)"/>
  <g transform="translate(1012 337)">
    <circle r="56" fill="#d4b878" stroke="#26394b" stroke-width="8"/>
    <path d="M-28 0q14-25 28 0t28 0" fill="none" stroke="#715b34" stroke-width="7" stroke-linecap="round"/>
    <text y="-77" font-family="system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle" fill="#26394b">电动机</text>
    <path d="M0 58V91" stroke="#26394b" stroke-width="8"/>
    <circle cy="145" r="53" fill="#647481" stroke="#26394b" stroke-width="8"/>
    <circle cy="145" r="19" fill="#d8e0e3" stroke="#26394b" stroke-width="6"/>
    <text y="226" font-family="system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle" fill="#26394b">车轮</text>
  </g>
</svg>
