    <path d="M105 479v94M170 479v94M235 479v94M300 479v94M365 479v94M430 479v94M495 479v94"/>
    <path d="M687 479v94M752 479v94M817 479v94M882 479v94M947 479v94M1012 479v94M1077 479v94"/>
  </g>
  <g stroke="#25364a" stroke-width="7">
    <path d="M82 430V343Q82 307 121 307H260Q291 307 309 430Z" fill="#6aa7c2"/>
    <path d="M387 430V343Q387 307 426 307H518Q537 307 545 430Z" fill="#d78a72"/>
    <path d="M664 430V343Q664 307 703 307H842Q873 307 891 430Z" fill="#6aa7c2"/>
  </g>
  <g fill="#dff2f6" stroke="#25364a" stroke-width="5"><rect x="115" y="334" width="124" height="55" rx="13"/><rect x="420" y="334" width="88" height="55" rx="13"/><rect x="697" y="334" width="124" height="55" rx="13"/></g>
  <g fill="#43525c"><circle cx="135" cy="447" r="23"/><circle cx="260" cy="447" r="23"/><circle cx="435" cy="447" r="23"/><circle cx="511" cy="447" r="23"/><circle cx="717" cy="447" r="23"/><circle cx="842" cy="447" r="23"/></g>
