    <path d="M346 462V225"/><rect x="309" y="169" width="74" height="121" rx="30" fill="#465d73"/><circle cx="346" cy="207" r="23" fill="#e2766b"/>
    <path d="M928 462V225"/><rect x="891" y="169" width="74" height="121" rx="30" fill="#465d73"/><circle cx="928" cy="252" r="23" fill="#66ae82"/>
  </g>
  <path d="M350 139H553" stroke="#e2766b" stroke-width="7" stroke-dasharray="14 12"/><path d="M932 139H1134" stroke="#66ae82" stroke-width="7" stroke-dasharray="14 12"/>
