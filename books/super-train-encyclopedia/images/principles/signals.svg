<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">铁路先确认前方线路，再给列车行车许可</title>
  <desc id="desc">左格里前方区段已有一列车，后车停在红色信号前等待；右格里前方区段已经空出，后车收到允许前进的显示后向前行驶。灯色只表示一种简化例子，真实信号规则随线路而异。</desc>
  <defs><marker id="goArrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 16 9 2 16Z" fill="#4d9775"/></marker></defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>
  <rect x="38" y="40" width="542" height="595" rx="30" fill="#f6f0e4" stroke="#d8d0c2" stroke-width="4"/>
  <rect x="620" y="40" width="542" height="595" rx="30" fill="#f6f0e4" stroke="#d8d0c2" stroke-width="4"/>
  <g font-family="system-ui, sans-serif" fill="#25364a" text-anchor="middle">
    <text x="309" y="95" font-size="34" font-weight="800">前面有车：先等一等</text>
    <text x="891" y="95" font-size="34" font-weight="800">前面空了：收到许可再走</text>
  </g>
  <g stroke="#677986" stroke-width="12" stroke-linecap="round"><path d="M75 500H545M657 500H1127"/><path d="M75 552H545M657 552H1127"/></g>
