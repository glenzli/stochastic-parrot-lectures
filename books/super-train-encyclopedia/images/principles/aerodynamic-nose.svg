<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">圆滑车头让空气顺着车身绕过去</title>
  <desc id="desc">一列只有一个圆滑车鼻的高速列车正在进入一个隧道门。三条细长蓝色气流线从左向右，平顺地绕过车头上方和下方。</desc>
  <defs>
    <marker id="airArrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#4f8298"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fffaf1"/>

  <text x="62" y="76" font-family="system-ui, sans-serif" font-size="43" font-weight="800" fill="#26394b">空气顺着圆滑车头绕过去</text>

  <!-- 一个隧道门：先画在车后，列车正向门内驶去。 -->
  <path d="M912 614V282A213 213 0 0 1 1125 69H1200V614Z" fill="#ded6ca" stroke="#8f7e69" stroke-width="10"/>
  <path d="M975 614V304A150 150 0 0 1 1125 154H1200V614Z" fill="#526879" stroke="#26394b" stroke-width="10"/>

  <!-- 只有一个完整、连续的圆滑车鼻。 -->
  <path d="M87 508V323Q87 292 122 292H592C748 292 858 339 963 438L1012 484Q1038 508 985 508Z" fill="#76aaa6" stroke="#26394b" stroke-width="10" stroke-linejoin="round"/>
  <path d="M155 335H586C718 335 812 366 897 428H155Z" fill="#dcebf0" stroke="#26394b" stroke-width="7"/>
  <path d="M345 335V428M552 335V428M746 356 704 428" stroke="#526a79" stroke-width="6"/>
  <path d="M88 489H1003" stroke="#26394b" stroke-width="24" stroke-linecap="round"/>
  <g fill="#526879" stroke="#26394b" stroke-width="8">
    <circle cx="271" cy="528" r="48"/>
    <circle cx="703" cy="528" r="48"/>
  </g>

  <!-- 三条长而细的线，只讲空气怎样绕行。 -->
  <g fill="none" stroke="#4f8298" stroke-width="6" stroke-linecap="round" marker-end="url(#airArrow)">
    <path d="M55 145C390 116 705 128 878 226C978 282 1054 289 1150 289"/>
    <path d="M55 225C380 201 684 214 846 286C956 335 1045 340 1150 340"/>
    <path d="M55 617C397 632 718 619 883 562C977 530 1060 528 1150 532"/>
  </g>

  <path d="M50 598H1160" stroke="#7c8991" stroke-width="16" stroke-linecap="round"/>
  <path d="M50 594H1160" stroke="#dce2e4" stroke-width="5" stroke-linecap="round"/>
</svg>
