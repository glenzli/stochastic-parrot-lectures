<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">硬硬的钢轮只压扁一点点，所以容易向前滚</title>
  <desc id="desc">左边是一只大钢轮在钢轨上向右滚动。右边的圆形放大图用夸张示意显示轮轨接触处只有很小的变形，不代表实际比例。变形小，滚动阻力也小。</desc>
  <defs>
    <marker id="rollArrow" viewBox="0 0 20 20" refX="17" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 18 10 2 18Z" fill="#bf6559"/>
    </marker>
    <clipPath id="zoomClip"><circle cx="913" cy="353" r="194"/></clipPath>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>

  <path d="M125 528H718" stroke="#6f7f8c" stroke-width="48" stroke-linecap="round"/>
  <path d="M125 514H718" stroke="#dbe2e7" stroke-width="10" stroke-linecap="round"/>
  <path d="M172 563H678" stroke="#b89d7b" stroke-width="28" stroke-linecap="round" stroke-dasharray="100 48"/>

  <circle cx="390" cy="316" r="210" fill="#66879b" stroke="#25364a" stroke-width="12"/>
  <circle cx="390" cy="316" r="64" fill="#d9b965" stroke="#25364a" stroke-width="10"/>
  <path d="M221 434Q390 525 559 434" fill="none" stroke="#dbe7ec" stroke-width="18" stroke-linecap="round"/>
  <path d="M170 92H624" fill="none" stroke="#bf6559" stroke-width="7" stroke-linecap="round" marker-end="url(#rollArrow)"/>
  <text x="395" y="66" font-family="system-ui, sans-serif" font-size="38" font-weight="760" text-anchor="middle" fill="#25364a">硬钢轮向前滚</text>

  <path d="M524 470C650 390 680 349 713 349" fill="none" stroke="#8aa0ad" stroke-width="5" stroke-dasharray="13 13"/>
  <circle cx="913" cy="353" r="204" fill="#f8f3e8" stroke="#25364a" stroke-width="10"/>
  <g clip-path="url(#zoomClip)">
    <rect x="710" y="146" width="410" height="414" fill="#f8f3e8"/>
    <path d="M654 23C746 62 831 159 852 261Q858 291 889 294H981Q1012 291 1019 261C1040 162 1127 64 1210 25V-30H654Z"
          fill="#66879b" stroke="#25364a" stroke-width="10"/>
    <path d="M842 301Q913 287 1028 301" fill="none" stroke="#dbe7ec" stroke-width="13" stroke-linecap="round"/>
    <path d="M700 326H1117V370H1061V497H1106V548H710V497H754V370H700Z"
          fill="#6f7f8c" stroke="#25364a" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="935" cy="319" rx="45" ry="11" fill="#c87366" opacity=".82"/>
    <path d="M735 396H1082" stroke="#cdd8de" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" font-weight="760" fill="#25364a">
    <text x="913" y="122" font-size="34">接触处放大</text>
    <text x="913" y="593" font-size="38" fill="#3f826b">只压扁一点点</text>
    <text x="913" y="632" font-size="26" fill="#6e655a">夸张示意，不是实际比例</text>
  </g>
  <rect x="146" y="601" width="506" height="54" rx="27" fill="#dceee5"/>
  <text x="399" y="639" font-family="system-ui, sans-serif" font-size="33" font-weight="760" text-anchor="middle" fill="#346f5c">变形小 · 滚起来省力</text>
</svg>
