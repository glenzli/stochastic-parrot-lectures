<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">弹簧让车轮的颠簸只轻轻传到车厢</title>
  <desc id="desc">左格是一只车轮撞上轨道的小凸起，红色箭头显示车轮猛地向上；右格是同一股颠簸经过车身下方的弹簧后变小，车厢里的小熊只轻轻摇晃。</desc>
  <defs>
    <marker id="hardArrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#c76857"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 16 9 2 16Z" fill="#448cad"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="34" fill="#fff9ed"/>
  <rect x="48" y="54" width="505" height="567" rx="30" fill="#f8f0df" stroke="#d7cbb7" stroke-width="5"/>
  <rect x="647" y="54" width="505" height="567" rx="30" fill="#eef5f3" stroke="#c7d8d3" stroke-width="5"/>
  <path d="M600 106V569" stroke="#d7cbb7" stroke-width="5" stroke-dasharray="14 16"/>

  <!-- 左：车轮真正撞上一个小凸起。 -->
  <path d="M104 509H277L307 477L337 509H495" fill="none" stroke="#637588" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M123 547H476" stroke="#a77d5b" stroke-width="14" stroke-dasharray="75 27" stroke-linecap="round"/>
  <circle cx="307" cy="414" r="92" fill="#4f6477" stroke="#25364a" stroke-width="10"/>
  <circle cx="307" cy="414" r="28" fill="#e9c66f" stroke="#25364a" stroke-width="7"/>
  <path d="M420 470V310" fill="none" stroke="#c76857" stroke-width="7" stroke-linecap="round" marker-end="url(#hardArrow)"/>
  <g fill="none" stroke="#c76857" stroke-width="6" stroke-linecap="round">
    <path d="M210 337 181 307"/><path d="M247 310 229 270"/><path d="M291 296V251"/>
  </g>

  <!-- 右：车轮和转向架在下，弹簧隔开车厢。 -->
  <path d="M704 509H1095" stroke="#637588" stroke-width="22" stroke-linecap="round"/>
  <path d="M724 547H1075" stroke="#a77d5b" stroke-width="14" stroke-dasharray="75 27" stroke-linecap="round"/>
  <circle cx="792" cy="477" r="62" fill="#4f6477" stroke="#25364a" stroke-width="9"/>
  <circle cx="1004" cy="477" r="62" fill="#4f6477" stroke="#25364a" stroke-width="9"/>
  <rect x="746" y="385" width="304" height="49" rx="18" fill="#596f82" stroke="#25364a" stroke-width="8"/>
  <g fill="none" stroke="#d4a959" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M813 384v-12l-18-13 36-19-36-19 36-19-18-13v-11"/>
    <path d="M983 384v-12l-18-13 36-19-36-19 36-19-18-13v-11"/>
  </g>
  <rect x="697" y="120" width="402" height="168" rx="43" fill="#78aa9b" stroke="#25364a" stroke-width="10"/>
  <rect x="736" y="153" width="324" height="104" rx="23" fill="#d9edf4" stroke="#25364a" stroke-width="7"/>
  <path d="M697 269H1099" stroke="#25364a" stroke-width="21" stroke-linecap="round"/>

  <!-- 小熊：只有很短的晃动弧线。 -->
  <g transform="translate(903 198)" stroke="#25364a" stroke-width="6">
    <circle cx="-24" cy="-39" r="17" fill="#b78962"/>
    <circle cx="24" cy="-39" r="17" fill="#b78962"/>
    <circle cy="-22" r="38" fill="#c99a6f"/>
    <ellipse cy="42" rx="48" ry="54" fill="#c99a6f"/>
    <circle cx="-13" cy="-27" r="4" fill="#25364a" stroke="none"/>
    <circle cx="13" cy="-27" r="4" fill="#25364a" stroke="none"/>
    <path d="M-8-12Q0-5 8-12" fill="none" stroke-width="4"/>
  </g>
  <g fill="none" stroke="#448cad" stroke-width="5" stroke-linecap="round">
    <path d="M836 143Q821 158 836 173" marker-end="url(#softArrow)"/>
    <path d="M970 143Q985 158 970 173" marker-end="url(#softArrow)"/>
  </g>
  <path d="M567 337H627" fill="none" stroke="#448cad" stroke-width="6" stroke-linecap="round" marker-end="url(#softArrow)"/>

  <g font-family="system-ui, sans-serif" font-size="32" font-weight="800" text-anchor="middle" fill="#25364a">
    <text x="300" y="103">轮子撞到凸起</text>
    <text x="899" y="103">小熊只轻轻晃</text>
    <text x="1110" y="345" text-anchor="end">弹簧</text>
  </g>
  <path d="M1085 354 1002 346" fill="none" stroke="#637588" stroke-width="4" stroke-linecap="round"/>
</svg>
